name: Validate and rebuild fonts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install font validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fontconfig opentype-sanitizer
          python -m pip install -r requirements.txt
      - name: Validate distributed fonts
        run: python scripts/validate_font.py --require-fontconfig --ots ots-sanitize
      - name: Verify reproducible font build
        run: python scripts/check_rebuild.py
      - name: Package release files
        run: python scripts/package_release.py
      - name: Save downloadable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RajdhaniMono-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
